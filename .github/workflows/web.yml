name: Web checks and Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'graphics-spec/**'
      - 'fixtures/**'
      - 'tooling/parity/**'
      - '.github/workflows/web.yml'
      - 'package.json'
      - 'LICENSE'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'graphics-spec/**'
      - 'fixtures/**'
      - 'tooling/parity/**'
      - '.github/workflows/web.yml'
      - 'package.json'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser smoke against the deployment artifact and Pages subpath
        run: npm run test:browser
        env:
          SITE_DIR: dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
